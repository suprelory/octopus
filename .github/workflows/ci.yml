name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to check for a release
        required: false
        type: string
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            polywire/go.sum

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare embedded static directory
        run: |
          mkdir -p static/out
          touch static/out/.keep

      - name: Format
        run: |
          # Scoped to the Go source roots so the check never walks web/node_modules.
          unformatted="$(gofmt -l cmd internal polywire scripts static main.go)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify Polywire independently
        working-directory: polywire
        run: |
          go vet ./...
          go test ./...
          go build ./...

      - name: Check Polywire concurrency
        working-directory: polywire
        run: go test -race . ./compat ./streamio

      - name: Verify standalone Polywire consumer
        run: |
          consumer="$(mktemp -d)"
          cp polywire/examples/convert/main.go "$consumer/main.go"
          cd "$consumer"
          go mod init example.com/polywire-consumer
          go mod edit -require=github.com/bestruirui/octopus/polywire@v0.0.0
          go mod edit -replace="github.com/bestruirui/octopus/polywire=$GITHUB_WORKSPACE/polywire"
          go mod tidy
          go run .

      - name: Test price generator
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Test
        run: go test ./...

      - name: Check backend concurrency
        timeout-minutes: 15
        run: go test -race ./internal/op ./internal/relay/... ./internal/sitesync ./internal/task ./internal/server/... ./internal/webdav

      - name: Build backend
        run: go build -tags=jsoniter ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests
        id: browser_tests
        run: pnpm test:e2e

      - name: Upload browser regression diagnostics
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Build frontend
        run: pnpm build
