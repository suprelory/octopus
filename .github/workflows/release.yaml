name: release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release tag
        id: tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python scripts/validate_release.py --ref "$RELEASE_REF" --sha "$RELEASE_SHA" --tag "$REQUESTED_TAG" --resolve-only >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.sha }}

  release:
    name: release
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
    
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify release checkout
        env:
          RELEASE_REF: refs/tags/${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python scripts/validate_release.py --ref "$RELEASE_REF" --sha "$RELEASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        run: bash scripts/build.sh release
        env:
          OCTOPUS_RELEASE_SIGNING_KEY: ${{ secrets.OCTOPUS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}

      # Older changelog runs may have already published notes without binaries.
      # Complete those entries, but never replace existing release assets.
      - name: Publish Release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          import json
          import os
          import pathlib
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          artifacts = sorted(str(path) for path in pathlib.Path("build/archives").glob("*") if path.is_file())
          if not artifacts:
              raise SystemExit("No release artifacts were built")
          existing = subprocess.run(
              ["gh", "release", "view", tag, "--json", "tagName,assets"],
              capture_output=True, text=True,
          )
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              if release["tagName"] != tag or release["assets"]:
                  raise SystemExit("Refusing to overwrite an existing release or its assets")
              subprocess.run(["gh", "release", "upload", tag, *artifacts], check=True)
          else:
              subprocess.run([
                  "gh", "release", "create", tag, *artifacts,
                  "--verify-tag", "--title", tag, "--generate-notes",
              ], check=True)

      - name: Docker meta (Debian)
        id: meta-debian
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.validate.outputs.tag }}

      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest-alpine
            type=raw,value=${{ needs.validate.outputs.tag }}-alpine

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            TARGETPLATFORM

      - name: Build and push (Debian)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}
          build-args: |
            TARGETPLATFORM
